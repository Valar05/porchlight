name: Deploy accessible map

on:
  push:
    branches: [main]
    paths:
      - 'site-packs/**'
      - 'map.mjs'
      - 'build-map.mjs'
      - 'site-pack.schema.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: porchlight-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node build-map.mjs . _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload accessible map
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
